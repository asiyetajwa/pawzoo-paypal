<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pawzoo TV</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root { --page: #e7e7ec; --board: #ffffff; --ink: #1f1b2e; --muted: #8a8698; --band: #f4f4f7; --press: #1f1b2e; --press-ink: #ffffff; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #0e0d13; --board: #191722; --ink: #f4f2fa; --muted: #9b97ab; --band: #221f2d; --press: #f4f2fa; --press-ink: #191722; color-scheme: dark; }
  }
  .board { --blob-a: #8b5cf6; --blob-b: #a78bfa; }
  .board.alert { --blob-a: #f43f5e; --blob-b: #fb7185; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font-family: "Outfit", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  .tv { position: fixed; inset: 0; display: grid; place-items: center; }

  /* Home and alert: the board */
  .board { position: relative; width: 86vw; height: 80vh; background: var(--board); border-radius: 5vh; box-shadow: 0 8vh 12vh -7vh rgba(31,27,46,.45); overflow: hidden; }
  .blob { position: absolute; left: 0; top: 0; width: 46%; height: 80%; border-radius: 5vh 26% 34% 0 / 5vh 22% 40% 0; background: linear-gradient(150deg, var(--blob-a), var(--blob-b)); }
  .display { position: absolute; left: 9%; top: 22%; margin: 0; color: #fff; font-weight: 800; font-size: 11vh; line-height: .95; letter-spacing: -0.025em; }
  .display span { display: block; }
  .prop { position: absolute; filter: drop-shadow(0 3vh 2.5vh rgba(31,27,46,.3)); animation: bob 6s ease-in-out infinite; }
  .prop.soft { filter: blur(8px); opacity: .9; }
  .side { position: absolute; left: 54%; right: 5%; top: 10%; bottom: 10%; display: flex; flex-direction: column; }
  .kicker { margin: 0 0 1vh; font-size: 1.6vh; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .title { margin: 0 0 3vh; font-size: 4.4vh; font-weight: 400; line-height: 1.15; }
  .rows { list-style: none; margin: 0; padding: 0; display: grid; }
  .rows li { padding: 2vh 2.2vh; border-radius: 1.8vh; font-size: 2.5vh; }
  .rows li:nth-child(odd) { background: var(--band); }
  .play { margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 2vh; font: inherit; font-size: 2.8vh; font-weight: 500; padding: 1.2vh 1.2vh 1.2vh 3.4vh; border-radius: 999px; border: 0; background: var(--press); color: var(--press-ink); cursor: pointer; }
  .play { white-space: nowrap; }
  .play .dot { flex: none; width: 6vh; height: 6vh; border-radius: 50%; background: var(--press-ink); display: grid; place-items: center; }
  .play .dot::after { content: ""; margin-left: .5vh; border-style: solid; border-width: 1.2vh 0 1.2vh 2vh; border-color: transparent transparent transparent var(--press); }
  .back { margin-top: 2.4vh; align-self: flex-start; font: inherit; font-size: 2.4vh; font-weight: 500; padding: 1.4vh 3vh; border-radius: 999px; border: 0; background: var(--band); color: var(--ink); cursor: pointer; }
  .play:focus { outline: 0.6vh solid #8b5cf6; outline-offset: 0.6vh; }
  .avatar { position: absolute; right: 5%; top: 9%; width: 6vh; height: 6vh; }
  .alert-still { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 2vh; background: #000; margin-bottom: 2.4vh; }
  .alert-body { font-size: 3vh; line-height: 1.35; margin: 0; }
  .hint { margin: 2vh 0 0; font-size: 2.2vh; color: var(--muted); }

  /* Player: full-bleed clip, light rail */
  .player { position: fixed; inset: 0; display: flex; flex-direction: column; background: #000; }
  .frame { position: relative; flex: 1; min-height: 0; }
  .frame video, .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .overlay { position: absolute; left: 4vw; bottom: 4vh; display: flex; flex-direction: column; align-items: flex-start; gap: 1vh; }
  .cap { background: var(--board); color: var(--ink); font-size: 3.6vh; font-weight: 500; padding: 1vh 2.4vh; border-radius: 999px; }
  .meta { background: rgba(31,27,46,.7); color: #fff; font-size: 2vh; padding: .6vh 1.6vh; border-radius: 999px; }
  .rail { display: flex; gap: 1.4vw; overflow-x: auto; padding: 2.4vh 4vw 3vh; background: var(--page); scrollbar-width: none; }
  .chapter { flex: none; width: 15vw; display: grid; gap: .6vh; text-align: left; background: var(--board); color: var(--ink); border: 0.4vh solid transparent; border-radius: 2.2vh; padding: .8vh; font: inherit; cursor: pointer; }
  .chapter[aria-current="true"], .chapter:focus { border-color: var(--press); outline: 0; }
  .chapter .thumb { aspect-ratio: 16/9; border-radius: 1.4vh; background: var(--band) center/cover no-repeat; }
  .chapter .t { font-size: 1.5vh; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; padding: 0 .4vh; }
  .chapter .c { font-size: 1.9vh; line-height: 1.25; padding: 0 .4vh .4vh; }
  .badge { position: fixed; top: 2vh; right: 2vw; z-index: 5; font-size: 1.6vh; color: var(--ink); background: var(--board); opacity: .85; padding: .6vh 1.4vh; border-radius: 999px; }

  .player:not([hidden]) ~ .badge { display: none; }

  /* Portrait (a phone): the blob on top, everything else below it, sizes from the width. */
  @media (max-aspect-ratio: 1/1) {
    .board { width: 92vw; height: 90vh; border-radius: 28px; }
    .blob { width: 100%; height: 28%; border-radius: 28px 28px 46% 12% / 28px 28px 30% 18%; }
    .display { left: 7%; top: 7%; font-size: min(13vw, 64px); }
    .prop { display: none; }
    .prop:first-of-type { display: block; left: auto !important; right: 7%; top: 6% !important; width: 24% !important; }
    .avatar { top: 31%; right: 6%; width: 40px; height: 40px; }
    .side { left: 7%; right: 7%; top: 31%; bottom: 4%; }
    .kicker { font-size: 12px; margin-bottom: 6px; }
    .title { font-size: 26px; margin: 0 56px 14px 0; }
    .rows li { font-size: 15px; padding: 10px 12px; border-radius: 12px; }
    .play { font-size: 17px; padding: 6px 6px 6px 20px; gap: 12px; }
    .play .dot { width: 40px; height: 40px; }
    .play .dot::after { margin-left: 3px; border-width: 8px 0 8px 13px; }
    .back { font-size: 15px; padding: 10px 18px; margin-top: 14px; }
    .alert-still { border-radius: 14px; margin-bottom: 14px; }
    .alert-body { font-size: 17px; }
    .hint { font-size: 14px; margin-top: 10px; }
    .overlay { left: 4vw; right: 4vw; bottom: 2vh; }
    .cap { font-size: 16px; padding: 6px 14px; }
    .meta { font-size: 12px; }
    .rail { gap: 10px; padding: 14px 4vw 18px; }
    .chapter { width: 44vw; border-radius: 14px; border-width: 3px; padding: 5px; }
    .chapter .thumb { border-radius: 10px; }
    .chapter .t { font-size: 11px; }
    .chapter .c { font-size: 13px; }
    .badge { top: 8px; right: 8px; font-size: 11px; padding: 4px 10px; }
  }
  @keyframes bob { 50% { translate: 0 -1.2vh; } }
  @media (prefers-reduced-motion: reduce) { .prop { animation: none; } }
</style>
</head>
<body>
<div class="tv">
  <section id="home" class="board">
    <div class="blob"></div>
    <h1 class="display" id="title"><span>Biscuit's</span><span>Day</span></h1>
    <img class="prop" src="props/ball.svg" alt="" style="left:30%;top:46%;width:19%">
    <img class="prop soft" src="props/bone.svg" alt="" style="left:5%;top:68%;width:13%">
    <img class="prop soft" src="props/cushion.svg" alt="" style="left:34%;top:3%;width:9%;rotate:12deg">
    <img class="avatar" src="logo.svg" alt="">
    <div class="side">
      <p class="kicker">Today on camera</p>
      <p class="title">What she<br>got up to</p>
      <ul id="summary" class="rows"></ul>
      <button id="play" class="play">Play the Day <i class="dot" aria-hidden="true"></i></button>
    </div>
  </section>

  <section id="alert" class="board alert" hidden role="alert">
    <div class="blob"></div>
    <h1 class="display"><span>She's</span><span>Out</span></h1>
    <img class="prop" src="props/house.svg" alt="" style="left:30%;top:46%;width:18%;rotate:-6deg">
    <div class="side">
      <p class="kicker">Front door camera</p>
      <img id="alert-still" class="alert-still" alt="Front door camera">
      <p id="alert-text" class="alert-body"></p>
      <p class="hint">Say "She's back inside" when she's home.</p>
      <button id="dismiss" class="back" type="button">Back to the Day</button>
    </div>
  </section>

  <section id="player" class="player" hidden>
    <div class="frame">
      <video id="video" muted playsinline></video>
      <img id="still" alt="" hidden>
      <div class="overlay"><span id="caption" class="cap"></span><span id="meta" class="meta"></span></div>
    </div>
    <nav id="rail" class="rail" aria-label="Moments"></nav>
  </section>
  <span class="badge">Pawzoo TV preview</span>
</div>
<script type="module" src="tv.js"></script>
</body>
</html>
